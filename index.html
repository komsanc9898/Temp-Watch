<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temp Alert Control Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #f7f9fa;
  --border: #e4e8ec;
  --text: #1b2430;
  --muted: #6b7684;
  --brand: #14998a;
  --brand-600: #0f8073;
  --brand-soft: #e2f4f1;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --crit: #a3153f;
  --crit-soft: #f9e3ea;
  --warn: #f0a234;
  --warn-soft: #fdf3e2;
  --orange: #e8590c;
  --info: #2f6fe4;
  --info-soft: #e6eefc;
  --cold: #2b8fd6;
  --cold-soft: #e3f1fb;
  --slate: #5b6475;
  --ok: #17a05d;
  --ok-soft: #e3f5ec;
  --track: #edf0f3;
  --glow-red: #f0384a;
  --glow-cyan: #12b8d6;
  --glow-blue: #1f8cf0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #151c22; --surface-2: #1a232a; --border: #26313a;
    --text: #e6edf2; --muted: #93a1ad; --brand-soft: #113a35; --track: #232d35;
    --danger-soft: #3a1b1d; --crit-soft: #3a1622; --warn-soft: #3a2d17; --info-soft: #172843;
    --cold-soft: #13304a; --ok-soft: #13341f; color-scheme: dark;
    --glow-red: #ff4757; --glow-cyan: #22d3ee; --glow-blue: #3aa8ff; --crit: #e8364a;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #151c22; --surface-2: #1a232a; --border: #26313a;
  --text: #e6edf2; --muted: #93a1ad; --brand-soft: #113a35; --track: #232d35;
  --danger-soft: #3a1b1d; --crit-soft: #3a1622; --warn-soft: #3a2d17; --info-soft: #172843;
  --cold-soft: #13304a; --ok-soft: #13341f; color-scheme: dark;
  --glow-red: #ff4757; --glow-cyan: #22d3ee; --glow-blue: #3aa8ff; --crit: #e8364a;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ===== Layout ===== */
.app { display: grid; grid-template-columns: 268px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 24px 16px; display: flex; flex-direction: column;
}
/* โลโก้ NIM Express | SEAL (รูปพื้นขาว — วางบนแผ่นขาวมุมโค้ง ใช้ได้ทั้งโหมดสว่างและมืด) */
.partner-logo { display: block; margin: 0 4px 18px; padding: 8px 10px; background: #fff; border-radius: 12px; }
.partner-logo img { display: block; width: 100%; height: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 12px 24px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.brand-logo .ico { width: 22px; height: 22px; }
.brand-name { font-weight: 700; letter-spacing: .12em; font-size: 15px; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .14em; font-weight: 600; }
.nav-group { font-size: 11px; letter-spacing: .16em; color: var(--muted); padding: 14px 16px 8px; font-weight: 500; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px;
  color: var(--text); font-weight: 500; border: 2px solid transparent;
  transition: background .15s, border-color .15s, box-shadow .2s;
}
.nav a:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--glow-cyan) 35%, transparent); }
/* เมนูที่เลือก: กรอบเรืองแสง */
.nav a.active {
  background: color-mix(in srgb, var(--glow-cyan) 10%, var(--surface)); color: var(--brand-600); font-weight: 600;
  border-color: var(--glow-cyan);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow-cyan) 30%, transparent), 0 0 14px color-mix(in srgb, var(--glow-cyan) 45%, transparent),
    inset 0 0 12px color-mix(in srgb, var(--glow-cyan) 14%, transparent);
}
:root[data-theme="dark"] .nav a.active { color: #5fd3c3; }
.nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
.nav-badge:empty { display: none; }
.sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
.nav-logout { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 16px; border: 2px solid transparent; border-radius: 12px;
  background: none; color: var(--muted); font-weight: 600; cursor: pointer; text-align: left; transition: background .15s, color .15s, border-color .15s; }
.nav-logout[hidden] { display: none; }
.nav-logout:hover { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.sidebar-foot { padding: 16px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(23,160,93,.5); animation: pulse 2s infinite; }
.live-dot.off { background: var(--muted); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(23,160,93,.5); } 70% { box-shadow: 0 0 0 8px rgba(23,160,93,0); } 100% { box-shadow: 0 0 0 0 rgba(23,160,93,0); } }

.main { padding: 28px 32px 48px; min-width: 0; }
.topbar { display: flex; gap: 16px; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.title-block { flex: 1; min-width: 220px; }
.title-block h1 { margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; }
.subtitle { color: var(--muted); font-size: 13px; letter-spacing: .02em; margin-top: 4px; }
.top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.icon-btn.menu-btn { display: none; }

.icon-btn {
  width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; position: relative;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .badge { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border: 2px solid var(--surface); }
.icon-btn .badge:empty { display: none; }
.select-pill, .user-chip {
  display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 14px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--surface); font-weight: 600;
}
.select-pill select, .user-chip select { border: 0; background: transparent; font-weight: 600; cursor: pointer; outline: none; }
.user-chip select { background: #233a8c; color: #fff; border-radius: 999px; padding: 3px 8px; font-size: 13px; max-width: 170px; }
.user-chip select option { color: #1b2430; background: #fff; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-600); }
.btn-ghost { background: var(--surface); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-outline { background: var(--surface); border-color: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-warn { background: var(--warn); color: #fff; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-xs { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ===== Filters ===== */
.filters { display: flex; gap: 12px; padding: 22px 0; flex-wrap: wrap; align-items: center; }
.filters.hidden { display: none; }
.field { height: 50px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 0 14px; min-width: 180px; outline: none; }
.field:focus-within, .field:focus { border-color: var(--brand); }
.field.search { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 240px; max-width: 360px; color: var(--muted); }
.field.search input { border: 0; outline: none; background: transparent; width: 100%; color: var(--text); }

/* ===== Panels ===== */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px 28px; margin-bottom: 22px; box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.panel h2 { margin: 0; font-size: 18px; font-weight: 700; }
.panel h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.link { color: var(--brand); font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
/* การ์ดตัวเลข: กรอบเรืองแสงสีเดียวกับไอคอน (--c) ทุกการ์ด */
.kpi {
  --c: var(--brand);
  position: relative; border-radius: var(--radius); padding: 22px 24px 18px; cursor: pointer;
  border: 2px solid var(--c);
  /* ไล่เฉด: ด้านบนเข้ม → ด้านล่างเป็นสีของการ์ด + แสงเรืองจากขอบล่าง */
  background:
    radial-gradient(95% 65% at 50% 112%, color-mix(in srgb, var(--c) 50%, transparent) 0%, transparent 72%),
    linear-gradient(165deg, color-mix(in srgb, var(--c) 3%, var(--surface)) 0%, color-mix(in srgb, var(--c) 14%, var(--surface)) 50%,
      color-mix(in srgb, var(--c) 34%, var(--surface)) 100%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 0 16px color-mix(in srgb, var(--c) 40%, transparent),
    inset 0 0 16px color-mix(in srgb, var(--c) 12%, transparent);
  transition: box-shadow .15s, transform .15s;
}
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent), 0 0 26px color-mix(in srgb, var(--c) 60%, transparent),
    inset 0 0 18px color-mix(in srgb, var(--c) 18%, transparent);
}
/* การ์ดกระพริบ (ใช้กับ "วิกฤต" เมื่อมีรถ > 0) */
.kpi.blink { animation: kpi-blink 1.4s ease-in-out infinite; }
.kpi.blink .kpi-ico { animation: kpi-ico-blink 1.4s ease-in-out infinite; }
@keyframes kpi-blink {
  0%, 100% {
    border-color: var(--c);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 0 12px color-mix(in srgb, var(--c) 35%, transparent),
      inset 0 0 12px color-mix(in srgb, var(--c) 10%, transparent);
  }
  50% {
    border-color: color-mix(in srgb, var(--c) 60%, #fff);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 55%, transparent), 0 0 34px color-mix(in srgb, var(--c) 85%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--c) 30%, transparent);
  }
}
@keyframes kpi-ico-blink { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .kpi.blink, .kpi.blink .kpi-ico { animation: none; } }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-label { font-weight: 600; color: var(--slate); font-size: 14px; }
:root[data-theme="dark"] .kpi-label { color: var(--muted); }
.kpi-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.kpi-ico .ico { width: 20px; height: 20px; }
.kpi-val { font-size: 34px; font-weight: 700; margin: 6px 0 4px; line-height: 1.2; }
.kpi-val small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.kpi-sub { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.kpi-sub b { color: var(--text); font-weight: 600; }

.grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-top: 30px; }
.status-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: center; }
.donut { width: 210px; height: 210px; border-radius: 50%; position: relative; margin: 0 auto; }
.donut::after { content: ""; position: absolute; inset: 28px; border-radius: 50%; background: var(--surface); }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 1; }
.donut-center b { font-size: 38px; line-height: 1; }
.donut-center span { color: var(--muted); font-size: 13px; margin-top: 6px; }
.stat-rows { display: flex; flex-direction: column; gap: 12px; }
.stat-row { border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; cursor: pointer; }
.stat-row:hover { border-color: var(--brand); }
.stat-row-top { display: flex; align-items: baseline; gap: 10px; }
.stat-row-top .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; align-self: center; }
.stat-row-top .name { font-weight: 700; }
.stat-row-top .name { white-space: nowrap; }
.stat-row .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.stat-row-top .num { margin-left: auto; font-size: 22px; font-weight: 700; }
.stat-row-top .pct { width: 56px; text-align: right; font-weight: 700; }
.bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; border-radius: inherit; }

.ro-note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; margin-bottom: 18px; border-radius: 14px;
  border: 2px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.ro-note > .ico { color: var(--warn); width: 22px; height: 22px; }
.ro-note > div { flex: 1; min-width: 200px; }
/* ไอคอนผู้ดูแล (Admin) บนการ์ดรถ */
.v-admin { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.v-admin-lbl { display: inline-flex; align-items: center; gap: 4px; margin-right: auto; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.v-admin-lbl .ico { width: 13px; height: 13px; }
.v-admin-btn { height: 30px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  border: 1.5px solid color-mix(in srgb, currentColor 45%, var(--border)); background: var(--surface); color: var(--ok);
  font-size: 12px; font-weight: 600; transition: background .15s, border-color .15s; }
.v-admin-btn .ico { width: 15px; height: 15px; }
.v-admin-btn:hover { border-color: currentColor; background: color-mix(in srgb, currentColor 12%, var(--surface)); }
.v-admin-btn.warn { color: var(--orange); }
/* กล่องรีเซ็ตเป็นปกติ */
.reset-btn { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.rs-list { margin-top: 10px; max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
.rs-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.rs-item:last-child { border-bottom: 0; }
.rs-item:hover { background: var(--surface-2); }
.rs-item input { width: 16px; height: 16px; accent-color: var(--brand); }
.rs-tags { margin-left: auto; display: flex; gap: 4px; }
.rs-warn { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--danger); background: var(--danger-soft); line-height: 1.7; }
.rs-warn > .ico { color: var(--danger); width: 22px; height: 22px; }
.modal-card.modal-md { max-width: 620px; }
.undo-btn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
tr.undone td { color: var(--muted); }
tr.undone td:nth-child(2) { text-decoration: line-through; }
/* ปุ่มค้นหา/ตัวกรอง */
.icon-btn .filter-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.icon-btn .filter-dot[hidden] { display: none; }
.icon-btn.on { border-color: var(--brand); color: var(--brand); }
.admin-log { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
.admin-log b { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
/* หน้าเข้าสู่ระบบ */
.login-screen { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; background: var(--surface); }
.login-screen[hidden] { display: none; }
.login-card { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 22px; }
.login-logo { display: block; width: 280px; max-width: 70%; height: auto; margin: 0 auto 4px; }
:root[data-theme="dark"] .login-logo { background: #fff; padding: 8px 12px; border-radius: 12px; }
.login-title { margin: 0; text-align: center; font-size: 32px; line-height: 1.3; font-weight: 700; }
.login-sub { margin: -10px 0 8px; text-align: center; color: var(--text); font-size: 16px; }
.lg-fl { display: flex; flex-direction: column; gap: 10px; font-weight: 700; font-size: 17px; }
.lg-inp { width: 100%; height: 66px; padding: 0 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
  font-size: 18px; font-weight: 400; outline: none; transition: border-color .15s, box-shadow .15s; }
.lg-inp::placeholder { color: var(--muted); }
.lg-inp:focus { border-color: #1f3a8a; box-shadow: 0 0 0 3px color-mix(in srgb, #1f3a8a 15%, transparent); }
.lg-inp.invalid { border-color: var(--danger); }
.lg-select, .lg-pass { position: relative; display: block; }
.lg-select .lg-inp { padding-right: 52px; }
.lg-select > .ico { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.lg-select input::-webkit-calendar-picker-indicator { opacity: 0; }
.lg-pass .lg-inp { padding-right: 60px; }
.lg-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 10px; }
.lg-eye:hover { background: var(--surface-2); color: var(--text); }
.lg-eye .ico { width: 22px; height: 22px; }
.lg-btn { height: 70px; margin-top: 8px; border: 0; border-radius: 16px; background: #1f3a8a; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; }
.lg-btn:hover { background: #18307a; }
.lg-btn:disabled { opacity: .7; cursor: progress; }
.login-err { color: var(--danger); font-size: 14px; min-height: 18px; margin: -10px 0 -14px; text-align: center; }
@media (max-width: 520px) { .login-title { font-size: 24px; } .lg-inp { height: 56px; font-size: 16px; } .lg-btn { height: 58px; } }
/* สรุปเคส */
.case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 26px; }
.case-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; background: var(--surface); min-width: 0; }
.case-box.wide { grid-column: 1 / -1; }
.cat-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.cat-sub { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.cat-sub b { color: var(--text); }
.closure-wrap { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
.donut.small-donut { width: 160px; height: 160px; }
.donut.small-donut::after { inset: 22px; }
.donut.small-donut .donut-center b { font-size: 24px; }
.sub-h { margin: 18px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 1100px) { .case-grid { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .closure-wrap { grid-template-columns: 1fr; } }
.dc-bars { display: flex; flex-direction: column; gap: 14px; }
.dc-bar { display: grid; grid-template-columns: 170px 1fr 34px; gap: 14px; align-items: center; font-size: 13px; cursor: pointer; }
.dc-bar:hover .dc-name { color: var(--brand); }
.dc-bar .bar { margin: 0; }
.dc-bar .n { text-align: right; font-weight: 700; }
.dc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== Table ===== */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td > div[style*="font-weight:600"] { white-space: nowrap; }
td { padding: 13px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.plate { font-weight: 700; white-space: nowrap; }
.plate small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.temp { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.temp.hot { color: var(--danger); }
.temp.cold { color: var(--cold); }
.temp.ok { color: var(--ok); }
.temp small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
.empty { text-align: center; padding: 40px 0; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.new { background: var(--danger-soft); color: var(--danger); }
.chip.ack { background: var(--warn-soft); color: #b8700f; }
.chip.resolved { background: var(--ok-soft); color: var(--ok); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.warn { background: var(--warn-soft); color: #b8700f; }
.chip.cold { background: var(--cold-soft); color: var(--cold); }
.chip.off { background: var(--track); color: var(--muted); }
:root[data-theme="dark"] .chip.ack, :root[data-theme="dark"] .chip.warn { color: #f5b95e; }
:root[data-theme="dark"] .chip.crit { color: #f17497; }

/* ===== Vehicles ===== */
.v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.v-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; background: var(--surface); }
.v-card.bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); cursor: pointer; }
.v-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.v-temp { font-size: 30px; font-weight: 700; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.v-meta { font-size: 12px; color: var(--muted); }
.range-bar { position: relative; height: 6px; background: var(--track); border-radius: 999px; margin: 10px 0 6px; }
.range-bar .ok-zone { position: absolute; top: 0; bottom: 0; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.range-bar .needle { position: absolute; top: -4px; width: 4px; height: 14px; border-radius: 2px; background: var(--text); transform: translateX(-2px); }

/* ===== Forms / settings ===== */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
.form-grid .full { grid-column: 1 / -1; }
.fl { display: block; font-size: 13px; font-weight: 600; }
.fl > .inp, .fl > .thumbs { display: block; margin-top: 6px; }
.fl > .checks, .fl > .thumbs { display: flex; margin-top: 6px; }
.fl .req { color: var(--danger); }
.inp { height: 42px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 0 12px; outline: none; font-weight: 400; width: 100%; }
textarea.inp { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.inp:focus { border-color: var(--brand); }
.inp.invalid { border-color: var(--danger); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-weight: 400; cursor: pointer; font-size: 13px; }
.check:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.check input { accent-color: var(--brand); margin: 0; }
/* ปุ่มเลือกแบบแบ่งช่อง (หมวดสาเหตุ / การปิดเคส) */
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 6px; border-radius: 12px; }
.seg.invalid { outline: 2px solid var(--danger); outline-offset: 3px; }
.seg-opt { --c: var(--brand); position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--border); background: var(--surface); font-weight: 500; transition: border-color .15s, background .15s, box-shadow .15s; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opt .ico { color: var(--c); }
.seg-opt:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--border)); }
.seg-opt:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: 0 0 12px color-mix(in srgb, var(--c) 35%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--c); outline-offset: 2px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.th-table td, .th-table th { padding: 10px; }
.th-table .inp { width: 110px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.switch input { width: 18px; height: 18px; accent-color: var(--brand); }

/* ===== Modal ===== */
.modal { position: fixed; inset: 0; background: rgba(10, 16, 22, .5); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 80; }
.modal-card.modal-sm { max-width: 440px; margin-top: 12vh; }
.modal.open { display: flex; }
.modal-card { background: var(--surface); border-radius: 20px; width: 100%; max-width: 880px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 22px 26px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-head .close { margin-left: auto; }
.modal-body { padding: 22px 26px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 26px 22px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.info { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; }
.info .k { font-size: 12px; color: var(--muted); }
.info .v { font-weight: 700; }
.chart-box { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px 6px; margin-bottom: 18px; }
.chart-box svg { width: 100%; height: auto; display: block; }
.timeline { display: flex; gap: 0; margin-bottom: 18px; }
.tl { flex: 1; position: relative; padding-top: 18px; font-size: 12px; }
.tl::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 2px; background: var(--track); }
.tl::after { content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--track); border: 2px solid var(--surface); }
.tl.done::before { background: var(--brand); }
.tl.done::after { background: var(--brand); }
.tl b { display: block; font-size: 13px; }
.section-title { font-weight: 700; font-size: 15px; margin: 6px 0 12px; display: flex; align-items: center; gap: 8px; }
.result-box { background: var(--surface-2); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; }
.result-box .full { grid-column: 1 / -1; }

/* ===== Bell & toasts ===== */
.bell-wrap { position: relative; }
.bell-panel { display: none; position: absolute; right: 0; top: 54px; width: 360px; max-height: 440px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.15); z-index: 30; }
.bell-panel.open { display: block; }
.bell-head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.bell-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 12px; }
.bell-item:hover { background: var(--surface-2); }
.bell-item .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.bell-item .ic .ico { width: 16px; height: 16px; }
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 90; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--brand); border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.15); max-width: 360px; cursor: pointer; animation: slide .25s ease-out; }
.toast.danger { border-left-color: var(--danger); }
.toast b { display: block; }
@keyframes slide { from { transform: translateY(12px); opacity: 0; } }

.scrim { display: none; }
.import-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; min-height: 150px; padding: 20px;
  border: 2px dashed var(--border); border-radius: 16px; background: var(--surface-2); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .ico { width: 30px; height: 30px; color: var(--brand); }
.import-result { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); }
.import-result.ok { background: var(--ok-soft); }
.import-result.ok > .ico { color: var(--ok); margin-top: 2px; }
.import-result.err { background: var(--danger-soft); color: var(--danger); }
@media (max-width: 760px) { .import-grid { grid-template-columns: 1fr; } }
body.busy { cursor: progress; }
body.busy .modal-foot .btn, body.busy [data-action="ack"] { pointer-events: none; opacity: .6; }

/* ===== Responsive ===== */
@media (max-width: 1500px) {
  .hide-md { display: none; }
}
@media (max-width: 1200px) {
  .grid-2 { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 40; width: 268px; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; }
  .icon-btn.menu-btn { display: grid; }
  .main { padding: 18px 16px 40px; }
  .title-block h1 { font-size: 22px; }
  .hide-sm { display: none; }
  .btn { padding: 0 14px; }
}
@media (max-width: 640px) {
  .status-wrap { grid-template-columns: 1fr; }
  .form-grid, .result-box { grid-template-columns: 1fr; }
  .field, .field.search { min-width: 0; max-width: none; flex: 1 1 100%; }
  .panel { padding: 20px 16px; }
  .dc-bar { grid-template-columns: 120px 1fr 28px; }
  .bell-panel { position: fixed; left: 16px; right: 16px; width: auto; top: 80px; }
  .user-chip select { max-width: 120px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: 16px; }
  .kpi-val { font-size: 28px; }
}

</style>

        <h1 class="login-title">Temperature Control Dashboard</h1>
        <p class="login-sub">กรุณาเข้าสู่ระบบ</p>
        <label class="lg-fl">DC
          <span class="lg-select"><input class="lg-inp" id="lgTeam" list="lgTeams" autocomplete="off" disabled
            placeholder="ผู้ใช้ส่วนกลาง · BKK · หรือพิมพ์ชื่อ DC" value="${esc(last)}">${icon('chevron')}</span>
          <datalist id="lgTeams"></datalist></label>
        <label class="lg-fl">Username<input class="lg-inp" id="lgUser" autocomplete="username" placeholder="ชื่อผู้ใช้" value="${esc(lastUser)}"></label>
        <label class="lg-fl">Password
          <span class="lg-pass"><input class="lg-inp" id="lgPin" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
          <button type="button" class="lg-eye" data-action="toggle-pass" aria-label="แสดง/ซ่อนรหัสผ่าน" title="แสดง/ซ่อนรหัสผ่าน">${icon('eye')}</button></span></label>
        <div class="login-err" id="lgErr">${esc(msg)}</div>
        <button class="lg-btn" type="submit" id="lgBtn">เข้าสู่ระบบ</button>
      </form>`;
    el.hidden = false;
    try {
      const j = await apiPost('teams');
      ui.teams = j.teams;
      $('#lgTeams').innerHTML = j.teams.map((t) => `<option value="${esc(t)}">`).join('');
      const t = $('#lgTeam');
      t.disabled = false;
      if (!j.teams.includes(t.value)) t.value = '';
      (t.value ? (lastUser ? $('#lgPin') : $('#lgUser')) : t).focus();
      if (!j.teams.length) $('#lgErr').textContent = 'ยังไม่มีทีมที่ตั้งรหัสผ่าน — ให้ผู้ดูแลกรอกรหัสผ่านในชีต Teams';
    } catch (e) { $('#lgErr').textContent = 'โหลดรายชื่อ DC ไม่ได้: ' + e.message; }
  }
  async function submitLogin() {
    const typed = $('#lgTeam').value.trim();
    // พิมพ์บางส่วนของชื่อ DC ได้ ถ้าตรงกับทีมเดียว
    const list = ui.teams || [];
    const team = list.includes(typed) ? typed : (() => { const m = list.filter((x) => x.toLowerCase().includes(typed.toLowerCase())); return typed && m.length === 1 ? m[0] : ''; })();
    const user = $('#lgUser').value.trim(), pin = $('#lgPin').value.trim();
    $('#lgTeam').classList.toggle('invalid', !team);
    $('#lgUser').classList.toggle('invalid', !user);
    $('#lgPin').classList.toggle('invalid', !pin);
    if (!team) { $('#lgErr').textContent = typed ? 'ไม่พบ DC นี้ — เลือกจากรายการ' : 'กรุณาเลือก DC'; return; }
    if (!user || !pin) { $('#lgErr').textContent = 'กรุณากรอก Username และ Password'; return; }
    $('#lgTeam').value = team;
    const btn = $('#lgBtn');
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
    try {
      const j = await apiPost('login', { team, pin });

  function parseDate(s) {

    if (m) {

      const dayFirst = a > 12;
      return new Date(y, (dayFirst ? b : a) - 1, dayFirst ? a : b, +(m[4] || 0), +(m[5] || 0)).getTime();
    }

    return isNaN(t) ? null : t;
  }
